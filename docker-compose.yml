version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: auditmind_db
    environment:
      POSTGRES_DB: auditmind
      POSTGRES_USER: auditmind_user
      POSTGRES_PASSWORD: auditmind_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditmind_user -d auditmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditmind_backend
    environment:
      - DATABASE_URL=postgresql://auditmind_user:auditmind_password@postgres:5432/auditmind
      - SECRET_KEY=auditmind_production_super_secret_key_2026
      - HINDSIGHT_URL=http://localhost:8888
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditmind_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
